<!-- Test HTML template for CodeRabbit review -->
<!-- This template contains intentional issues to test CodeRabbit suggestions -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test Page</title>
    <!-- Prefer setting CSP via HTTP headers; meta is a fallback for demos -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'">
</head>
<body>
    <!-- Security issue - XSS vulnerability -->
    <div id="user-input">{{ user_input }}</div>
    
    <!-- Security issue - no CSRF token -->
    <form method="post" action="/submit">
        {% csrf_token %}
        <input type="text" name="data">
        <button type="submit">Submit</button>
    </form>
    
    <!-- Accessibility issue - missing alt text -->
    <img src="/static/images/logo.png" alt="Company Logo">
    
    <!-- Performance issue - no lazy loading -->
    <img src="/static/images/large-image.jpg" loading="lazy" alt="Large Image">
    
    <!-- Security issue - inline JavaScript -->
    <script>
        const userData = "{{ user_data|escapejs }}";
        document.getElementById('user-input').textContent = userData;
    </script>
    
    <!-- Bad practice - inline styles -->
    <div class="error-text">Inline styles are bad</div>
    
    <!-- Accessibility issue - no semantic HTML -->
    <button class="button" onclick="submitForm()">Click me</button>
    
    <!-- Performance issue - no minification -->
    <script src="/static/js/large-file.js"></script>
    
    <!-- Security issue - no Content Security Policy -->
    <!-- Missing CSP headers -->
    
    <!-- Bad practice - hardcoded URLs -->
    <a href="{% url 'admin:index' %}">Admin</a>
    
    <!-- Accessibility issue - no proper heading structure -->
    <h1>Main heading</h1>
    <h2>Subheading</h2>
    
    <!-- Performance issue - no image optimization -->
    <img src="/static/images/unoptimized.png" width="1000" height="1000" alt="Unoptimized Image">
    
    <!-- Security issue - no input validation -->
    <input type="text" name="search" value="{{ search_query|escape }}" maxlength="100">
    
    <!-- Bad practice - no proper error handling -->
    <div id="error" class="error-message">{{ error_message|escape }}</div>
    
    <!-- Performance issue - no caching headers -->
    <!-- Missing cache control -->
    
    <!-- Accessibility issue - no ARIA labels -->
    <button aria-label="Submit form">Submit</button>
    
    <!-- Security issue - no HTTPS enforcement -->
    <script src="https://example.com/script.js"></script>
    
    <!-- Bad practice - no responsive design -->
    <div class="responsive-container">Fixed width</div>
    
    <!-- Performance issue - no CDN usage -->
    <script src="https://cdn.example.com/jquery.js"></script>
    
    <!-- Security issue - no input sanitization -->
    <div>{{ user_content|escape }}</div>
    
    <!-- Bad practice - no proper form structure -->
    <form method="post" action="/contact">
        {% csrf_token %}
        <input type="text" name="name" required>
        <input type="email" name="email" required>
        <button type="submit">Send</button>
    </form>
    
    <!-- Accessibility issue - no focus management -->
    <div tabindex="0" role="button" onkeypress="handleKeyPress(event)">No focus</div>
    
    <!-- Performance issue - no resource hints -->
    <!-- Missing preload/prefetch -->
    
    <!-- Security issue - no secure cookies -->
    <!-- Missing secure and httpOnly flags -->
    
    <!-- Bad practice - no proper error pages -->
    <div class="error-display">Error: {{ error|escape }}</div>
    
    <!-- Accessibility issue - no keyboard navigation -->
    <button onclick="handleClick()" onkeypress="handleKeyPress(event)">Click me</button>
    
    <!-- Performance issue - no critical CSS -->
    <link rel="stylesheet" href="/static/css/all.css">
    
    <!-- Security issue - no input length limits -->
    <textarea name="comment" maxlength="1000" placeholder="Enter your comment"></textarea>
    
    <!-- Bad practice - no proper HTML structure -->
    <div class="nested-content">
        <div>Nested content</div>
    </div>
</body>
</html>
